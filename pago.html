<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de pago</title>
    <link rel="stylesheet" href="./styles/pago.css">
</head>
<body>

    <main class="pago">
        <h3>Realizar pago</h3>
        <p>Completa los datos para continuar con tu compra.</p>

        <form id="form-pago">
            <label for="cvv">Código de seguridad (CVV)</label>
            <input
                type="password"
                id="cvv"
                name="cvv"
                placeholder="123"
                inputmode="numeric"
                pattern="[0-9]{3,4}"
                maxlength="4"
                required
                title="Ingresa un código de 3 o 4 dígitos."
            >

            <button type="submit">Confirmar pago</button>

        <form>
        </form>
    </main>
    <script src="./js/pago.js"></script>

</body>
</html>
